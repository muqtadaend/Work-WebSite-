<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Praktikum - MyPortfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <style>
        /* Desain Preview Detail Laporan (Tema Gelap Premium) */
        .report-body-preview {
            background-color: #111827;
            color: #d1d5db;
            padding: 30px;
            border-radius: 12px;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .report-body-preview h3 {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            margin-top: 35px;
            margin-bottom: 15px;
            border-left: 4px solid #dc3545;
            padding-left: 10px;
        }
        .report-body-preview p {
            line-height: 1.7;
            color: #9ca3af;
        }
        .step-block {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .step-title {
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .step-screenshot-container {
            background-color: #0b0f19;
            border: 1px solid #4b5563;
            padding: 8px;
            border-radius: 6px;
            margin-top: 12px;
            text-align: center;
        }
        .step-screenshot-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .step-caption {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 6px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">MyPortfolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-primary text-white text-center py-5">
        <div class="container">
            <h1>Arsip Blog Praktikum</h1>
            <p class="lead font-monospace">Dokumentasi dan Hasil Laporan Praktikum Informatika</p>
        </div>
    </header>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <h3 class="mb-4 fw-bold text-dark"><i class="fas fa-book me-2 text-danger"></i>Daftar Laporan Kuliah</h3>
                    
                    <div id="blogContainer" class="row g-4">
                        </div>
                </div>
            </div>
        </div>
    </section>

    <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content border-0">
                <div class="modal-header bg-dark text-white border-secondary">
                    <h5 class="modal-title fw-bold" id="modalReportTitle">Detail Laporan</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body bg-dark">
                    <div class="report-body-preview">
                        <p id="viewDeskripsi" class="text-white-50 mb-4"></p>
                        
                        <h3>A. TUJUAN</h3>
                        <p id="viewTujuan" class="text-white-50 ms-2"></p>
                        
                        <h3>B. TEORI DAN LANGKAH - LANGKAH</h3>
                        <div id="viewLangkahContainer" class="mt-3"></div>

                        <h3>C. KESIMPULAN</h3>
                        <p id="viewKesimpulan" class="text-white-50 ms-2"></p>
                    </div>
                </div>
                <div class="modal-footer bg-dark border-top border-secondary">
                    <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white-50 py-3 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 MyPortfolio. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Fungsi Memuat Data Laporan
        function loadReports() {
            const container = document.getElementById('blogContainer');
            container.innerHTML = '';

            let savedReports = localStorage.getItem('laporanPraktikum');
            let reports = savedReports ? JSON.parse(savedReports) : [];

            if (reports.length === 0) {
                container.innerHTML = `<div class="col-12 text-center text-muted py-5"><h5>Belum ada laporan yang di-publish.</h5></div>`;
                return;
            }

            // Render Card (Laporan terbaru muncul di atas)
            reports.forEach((report, index) => {
                const cardHTML = `
                    <div class="col-12">
                        <div class="card shadow-sm border-start border-danger border-4">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-dark">${report.matkul}</span>
                                    <small class="text-muted"><i class="far fa-calendar-alt me-1"></i> ${report.tanggal}</small>
                                </div>
                                <h4 class="card-title fw-bold text-dark">${report.judul}</h4>
                                <p class="card-text text-secondary">${report.deskripsi.substring(0, 160)}...</p>
                                
                                <div class="hidden-json-data d-none" id="data-${index}">${JSON.stringify(report)}</div>
                            </div>
                            <div class="card-footer bg-transparent border-0 pt-0">
                                <button class="btn btn-sm btn-outline-danger view-report-btn" data-id="${index}">Baca Selengkapnya <i class="fas fa-search ms-1"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('afterbegin', cardHTML);
            });
        }

        document.addEventListener('DOMContentLoaded', loadReports);

        // Event delegation buka Modal
        document.getElementById('blogContainer').addEventListener('click', function(e) {
            if (e.target && e.target.classList.contains('view-report-btn')) {
                const id = e.target.getAttribute('data-id');
                const jsonText = document.getElementById(`data-${id}`).innerHTML;
                const data = JSON.parse(jsonText);

                document.getElementById('modalReportTitle').innerText = data.judul;
                document.getElementById('viewDeskripsi').innerText = data.deskripsi;
                document.getElementById('viewTujuan').innerText = data.tujuan;
                document.getElementById('viewKesimpulan').innerText = data.kesimpulan;

                const langkahContainer = document.getElementById('viewLangkahContainer');
                langkahContainer.innerHTML = '';

                data.langkah.forEach(item => {
                    const blockHTML = `
                        <div class="step-block">
                            <div class="step-title">${item.title}</div>
                            <p class="text-white-50 m-0">${item.desc}</p>
                            <div class="step-screenshot-container">
                                <img src="${item.img}" alt="Screenshot ${item.title}">
                                <div class="step-caption">// SCREENSHOT PROSES ${item.title.toUpperCase()}</div>
                            </div>
                        </div>
                    `;
                    langkahContainer.insertAdjacentHTML('beforeend', blockHTML);
                });

                const myModal = new bootstrap.Modal(document.getElementById('reportModal'));
                myModal.show();
            }
        });
    </script>
</body>
</html>
