<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Manajemen Laporan (Admin Only)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; padding-top: 30px; padding-bottom: 60px; }
        .dynamic-step-item { background-color: #fff; border: 1px solid #ced4da; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .admin-card-list { max-height: 75vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="container-fluid px-4">
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
            <h3 class="text-danger fw-bold m-0"><i class="fas fa-user-shield me-2"></i>Control Panel Dashboard (Protected)</h3>
            <a href="blog.html" class="btn btn-dark fw-bold"><i class="fas fa-globe me-1"></i> Ke Halaman Utama Blog</a>
        </div>

        <div class="row g-4">
            <div class="col-xl-5 col-lg-6">
                <div class="card shadow border-0 p-4 sticky-top" style="top: 20px; max-height: 85vh; overflow-y: auto;">
                    <h4 class="mb-3 text-primary fw-bold"><i class="fas fa-plus-circle me-2"></i>Input Tugas Baru</h4>
                    <form id="praktikumForm" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mata Kuliah</label>
                            <input type="text" class="form-control" id="formMatkul" placeholder="Contoh: Pemrograman Web" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Judul Utama</label>
                            <input type="text" class="form-control" id="formJudul" placeholder="Contoh: Modul 7 - Laravel Migration" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Deskripsi Singkat</label>
                            <textarea class="form-control" id="formDeskripsi" rows="2" placeholder="Pengantar singkat materi..." required></textarea>
                        </div>
                        
                        <hr>
                        <h6 class="text-primary fw-bold">A. TUJUAN PRAKTIKUM</h6>
                        <div class="mb-3">
                            <textarea class="form-control" id="formTujuan" rows="2" placeholder="Tuliskan tujuan..." required></textarea>
                        </div>

                        <hr>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="text-primary fw-bold m-0">B. TEORI & LANGKAH-LANGKAH</h6>
                            <button type="button" class="btn btn-sm btn-dark" id="addStepBtn"><i class="fas fa-plus me-1"></i> Tambah Sub-Bab</button>
                        </div>
                        
                        <div id="dynamicStepsContainer">
                            <div class="dynamic-step-item">
                                <span class="badge bg-danger mb-2 step-number-label">Sub-Bagian 1</span>
                                <div class="mb-2">
                                    <input type="text" class="form-control form-step-title" placeholder="Nama Sub-Materi (Misal: 1. Konfigurasi)" required>
                                </div>
                                <div class="mb-2">
                                    <textarea class="form-control form-step-desc" rows="2" placeholder="Penjelasan..." required></textarea>
                                </div>
                                <div>
                                    <input type="file" class="form-control form-step-file" accept="image/*" required>
                                </div>
                            </div>
                        </div>

                        <hr>
                        <h6 class="text-primary fw-bold">C. KESIMPULAN</h6>
                        <div class="mb-4">
                            <textarea class="form-control" id="formKesimpulan" rows="2" placeholder="Kesimpulan akhir..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 fw-bold py-2">Publish & Simpan <i class="fas fa-cloud-upload-alt ms-1"></i></button>
                    </form>
                </div>
            </div>

            <div class="col-xl-7 col-lg-6">
                <div class="card shadow border-0 p-4">
                    <h4 class="mb-3 text-dark fw-bold"><i class="fas fa-folder-open me-2 text-warning"></i>Daftar Laporan Ter-upload</h4>
                    <p class="text-muted small">Kamu bisa memantau data yang sudah masuk atau menghapusnya jika terjadi salah input data.</p>
                    <div id="adminReportContainer" class="admin-card-list row g-3">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========================================================
        // 🔐 SISTEM KEAMANAN VERIFIKASI PASSWORD ADMIN (CARA 2)
        // ========================================================
        // Kamu bebas mengganti kata "adminInformatika123" dengan password rahasiamu sendiri
        const PASSWORD_RAHASIA_ADMIN = "akungame12,."; 
        
        // Meminta input dari user sesaat setelah halaman mencoba dimuat
        let verifikasiUser = prompt("Akses Terbatas! Masukkan Password Kode Verifikasi Admin:");

        if (verifikasiUser !== PASSWORD_RAHASIA_ADMIN) {
            alert("Verifikasi Gagal! Password salah atau Anda bukan admin pemilik web.");
            window.location.href = "blog.html"; // Tendang paksa kembali ke halaman utama blog
        }
        // ========================================================


        let stepCount = 1;

        // Tambah field dinamis sub-bab materi
        document.getElementById('addStepBtn').addEventListener('click', function() {
            stepCount++;
            const container = document.getElementById('dynamicStepsContainer');
            const stepHTML = `
                <div class="dynamic-step-item">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-danger step-number-label">Sub-Bagian ${stepCount}</span>
                        <button type="button" class="btn btn-sm btn-link text-danger p-0 remove-step-btn"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    <div class="mb-2">
                        <input type="text" class="form-control form-step-title" placeholder="Nama Sub-Materi..." required>
                    </div>
                    <div class="mb-2">
                        <textarea class="form-control form-step-desc" rows="2" placeholder="Penjelasan..." required></textarea>
                    </div>
                    <div>
                        <input type="file" class="form-control form-step-file" accept="image/*" required>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', stepHTML);
        });

        // Hapus field dinamis sub-bab materi
        document.getElementById('dynamicStepsContainer').addEventListener('click', function(e) {
            if (e.target.classList.contains('remove-step-btn') || e.target.closest('.remove-step-btn')) {
                e.target.closest('.dynamic-step-item').remove();
                stepCount--;
                document.querySelectorAll('.step-number-label').forEach((label, idx) => {
                    label.innerText = `Sub-Bagian ${idx + 1}`;
                });
            }
        });

        // Fungsi Render List Laporan Khusus Admin beserta Tombol Hapus
        function renderAdminList() {
            const container = document.getElementById('adminReportContainer');
            container.innerHTML = '';
            
            let savedReports = localStorage.getItem('laporanPraktikum');
            let reports = savedReports ? JSON.parse(savedReports) : [];

            if(reports.length === 0) {
                container.innerHTML = `<div class="text-center text-muted py-5"><h5>Belum ada data laporan praktikum yang di-upload.</h5></div>`;
                return;
            }

            reports.forEach((report, index) => {
                const itemHTML = `
                    <div class="col-12">
                        <div class="p-3 border rounded bg-light d-flex justify-content-between align-items-center">
                            <div>
                                <span class="badge bg-secondary mb-1">${report.matkul}</span>
                                <h6 class="fw-bold m-0 text-dark">${report.judul}</h6>
                                <small class="text-muted">Dibuat pada: ${report.tanggal} • (${report.langkah.length} Sub-Materi)</small>
                            </div>
                            <button class="btn btn-danger btn-sm delete-report-btn" data-index="${index}">
                                <i class="fas fa-trash-alt me-1"></i> Hapus
                            </button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('afterbegin', itemHTML);
            });
        }

        // Fungsi Jalankan Aksi Hapus Laporan dari LocalStorage
        document.getElementById('adminReportContainer').addEventListener('click', function(e) {
            if (e.target && e.target.classList.contains('delete-report-btn')) {
                const indexToDelete = e.target.getAttribute('data-index');
                
                if (confirm("Apakah kamu benar-benar yakin ingin menghapus laporan praktikum ini dari database blog publik?")) {
                    let savedReports = JSON.parse(localStorage.getItem('laporanPraktikum'));
                    savedReports.splice(indexToDelete, 1);
                    localStorage.setItem('laporanPraktikum', JSON.stringify(savedReports));
                    renderAdminList();
                }
            }
        });

        // Simpan Form Data Baru ke LocalStorage
        document.getElementById('praktikumForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            if (!this.checkValidity()) {
                event.stopPropagation();
                this.classList.add('was-validated');
                return;
            }

            const readAsDataURL = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    if(file) reader.readAsDataURL(file);
                    else resolve('');
                });
            };

            const stepElements = document.querySelectorAll('.dynamic-step-item');
            const langkahArray = [];

            for (let el of stepElements) {
                const file = el.querySelector('.form-step-file').files[0];
                const base64Img = await readAsDataURL(file);
                langkahArray.push({
                    title: el.querySelector('.form-step-title').value,
                    desc: el.querySelector('.form-step-desc').value,
                    img: base64Img
                });
            }

            const newReport = {
                matkul: document.getElementById('formMatkul').value,
                judul: document.getElementById('formJudul').value,
                deskripsi: document.getElementById('formDeskripsi').value,
                tujuan: document.getElementById('formTujuan').value,
                kesimpulan: document.getElementById('formKesimpulan').value,
                tanggal: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
                langkah: langkahArray
            };

            let savedReports = localStorage.getItem('laporanPraktikum');
            let reports = savedReports ? JSON.parse(savedReports) : [];
            reports.push(newReport);
            localStorage.setItem('laporanPraktikum', JSON.stringify(reports));

            alert('Sukses! Laporan baru berhasil disimpan dan di-publish ke halaman blog.');
            this.reset();
            this.classList.remove('was-validated');
            document.getElementById('dynamicStepsContainer').innerHTML = `
                <div class="dynamic-step-item">
                    <span class="badge bg-danger mb-2 step-number-label">Sub-Bagian 1</span>
                    <div class="mb-2">
                        <input type="text" class="form-control form-step-title" placeholder="Nama Sub-Materi (Misal: 1. Konfigurasi)" required>
                    </div>
                    <div class="mb-2">
                        <textarea class="form-control form-step-desc" rows="2" placeholder="Penjelasan..." required></textarea>
                    </div>
                    <div>
                        <input type="file" class="form-control form-step-file" accept="image/*" required>
                    </div>
                </div>
            `;
            stepCount = 1;
            renderAdminList();
        });

        document.addEventListener('DOMContentLoaded', renderAdminList);
    </script>
</body>
</html>
